apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-auth
  namespace: default
  labels:
    app: session-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-auth
  template:
    metadata:
      labels:
        app: session-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: session-auth
          image: ghcr.io/kekoam/schm:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SESSION_COOKIE_NAME
              value: "sessionid"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: session-auth
  namespace: default
spec:
  selector:
    app: session-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
